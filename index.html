<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status | AlwaysNode</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 1rem; }
        p { font-size: 0.9rem; line-height: 1.6; color: #8b949e; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background-color: #238636;
            color: white;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #f0f6fc1a;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>节点状态监控</h1>
        <div class="status-badge">已通过 Cloudflare 保护</div>
        
        <p>你的 Node.js 服务运行正常。<br>点击下方按钮获取节点订阅内容：</p>
        
        <a href="/hop" class="btn">获取 Base64 订阅链接</a>
        <a href="https://github.com/fno000hopezexal-afk/alwaysnode" target="_blank" class="btn">查看项目源码</a>

        <div class="footer">
            Powered by Alwaysdata & Node.js<br>
            UUID: <span id="uuid-hint">已加密保护</span>
        </div>
    </div>
</body>
</html>Hellow world
